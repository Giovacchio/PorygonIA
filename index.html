   ============================================================ */
const POKEAPI_ALIASES = {
  'indeedee-female':'Indeedee-F', 'indeedee-male':'Indeedee', 'basculegion-male':'Basculegion', 'basculegion-female':'Basculegion-F',
  'meowstic-male':'Meowstic', 'meowstic-female':'Meowstic-F', 'aegislash-shield':'Aegislash', 'toxtricity-amped':'Toxtricity',
  'lycanroc-midday':'Lycanroc', 'mimikyu-disguised':'Mimikyu', 'morpeko-full-belly':'Morpeko', 'gourgeist-average':'Gourgeist',
  'palafin-zero':'Palafin', 'maushold-family-of-four':'Maushold-Four', 'maushold-family-of-three':'Maushold',
  'squawkabilly-green-plumage':'Squawkabilly', 'tauros-paldea-combat-breed':'Tauros-Paldea-Combat',
  'tauros-paldea-blaze-breed':'Tauros-Paldea-Blaze', 'tauros-paldea-aqua-breed':'Tauros-Paldea-Aqua',
  'oricorio-baile':'Oricorio', 'wishiwashi-solo':'Wishiwashi', 'minior-red-meteor':'Minior', 'eiscue-ice':'Eiscue',
  'sinistcha-unremarkable':'Sinistcha', 'polteageist-phony':'Polteageist', 'vivillon-meadow':'Vivillon', 'floette-red':'Floette',
};
function migrateSlot(s) {
  if (!s) return null;
  // già nel formato nuovo
  if (s.sp && !s.evs && getSpecies(s.species)) return { ...s, teraType: undefined, level: undefined };
  const raw = String(s.species || s.name || '').toLowerCase();
  const spName = POKEAPI_ALIASES[raw] || (getSpecies(raw) ? getSpecies(raw).name : null);
  const sp = spName ? getSpecies(spName) : null;
  const dn = s.displayName || raw;
  if (!sp || sp.isMega || sp.battleOnly) {
    return { species: dn, legacy: { displayName: dn, reason: 'Non legale in Reg M-C', original: s } };
  }
  const evs = s.evs || {};
  const spts = {};
  for (const k of STAT_KEYS) spts[k] = Math.min(SP_STAT_MAX, Math.floor(((evs[k] || 0) + 4) / 8));
  // rientra nei 66 totali togliendo da Vel/PS per ultimi
  let over = spTotal(spts) - SP_TOTAL_MAX;
  for (const k of ['def','spd','hp','atk','spa','spe']) { if (over <= 0) break; const cut = Math.min(over, spts[k]); spts[k] -= cut; over -= cut; }
  const abil = sp.abilities.find(a => toID(a) === toID(s.ability)) || sp.abilities[0];
  const item = (LEGAL_ITEMS.includes(s.item) || STONE_NAMES.has(s.item)) ? s.item : '';
  const ls = learnsetOf(sp.name);
  const moves = (s.moves || [null,null,null,null]).slice(0, 4).map(m => {
    if (!m) return null;
    const mv = getMove(m);
    return mv && ls.some(x => x.id === mv.id) ? mv.name : null;
  });
  while (moves.length < 4) moves.push(null);
  const notes = [];
  if (s.item && s.item !== 'None' && !item) notes.push(`${s.item} non esiste in Champions`);
  const lost = (s.moves || []).filter(Boolean).length - moves.filter(Boolean).length;
  if (lost > 0) notes.push(`${lost} mosse non disponibili rimosse`);
  return { species: sp.name, nickname: s.nickname || '', item, ability: abil, nature: s.nature || 'Hardy', sp: spts, moves, migrated: notes.length ? notes : undefined };
}
function migrateTeams(list) {
  return list.map(t => ({
    id: t.id, name: t.name,
    team: (t.team || Array(6).fill(null)).slice(0, 6).map(migrateSlot),
    opponentTeam: (t.opponentTeam || Array(6).fill(null)).slice(0, 6).map(migrateSlot),
  }));
}

/* ============================================================
   IMPORT / EXPORT formato Showdown (EVs = Stat Points in Champions)
   ============================================================ */
function exportSlot(slot) {
  if (!slotIsLegal(slot)) return '';
  const lines = [];
  lines.push(`${slot.nickname ? `${slot.nickname} (${slot.species})` : slot.species}${slot.item ? ` @ ${slot.item}` : ''}`);
  if (slot.ability) lines.push(`Ability: ${slot.ability}`);
  lines.push('Level: 50');
  const sps = STAT_KEYS.filter(k => slot.sp?.[k]).map(k => `${slot.sp[k]} ${STAT_SHORT_EN[k]}`);
  if (sps.length) lines.push(`EVs: ${sps.join(' / ')}`);
  lines.push(`${slot.nature || 'Hardy'} Nature`);
  for (const m of slot.moves || []) if (m) lines.push(`- ${m}`);
  return lines.join('\n');
}
function exportTeam(team) { return team.filter(slotIsLegal).map(exportSlot).join('\n\n'); }
function importTeam(text) {
  const blocks = text.replace(/\r/g, '').split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  const out = []; const errors = [];
  for (const b of blocks) {
    const lines = b.split('\n').map(l => l.trim()).filter(Boolean);
    let first = lines[0];
    let item = '';
    if (first.includes('@')) { item = first.split('@')[1].trim(); first = first.split('@')[0].trim(); }
    first = first.replace(/\((M|F)\)\s*$/, '').trim();
    let nickname = '', speciesTxt = first;
    const paren = first.match(/^(.*)\(([^)]+)\)\s*$/);
    if (paren) { nickname = paren[1].trim(); speciesTxt = paren[2].trim(); }
    let sp = getSpecies(speciesTxt);
    if (sp && sp.isMega) { const base = getSpecies(sp.megaBase); if (!item) item = sp.megaStone; sp = base; }
    if (!sp || sp.battleOnly) { errors.push(`"${speciesTxt}" non è legale in Reg M-C`); continue; }
    const slot = newSlot(sp.name);
    slot.nickname = nickname;
    if (item) {
      const it = [...LEGAL_ITEMS, ...STONE_NAMES].find(x => toID(x) === toID(item));
      if (it) slot.item = it; else errors.push(`${sp.name}: oggetto "${item}" non disponibile`);
    }
    const ls = learnsetOf(sp.name);
    const moves = [];
    let evLine = null;
    for (const l of lines.slice(1)) {
      if (/^Ability:/i.test(l)) { const a = l.split(':')[1].trim(); const f = sp.abilities.find(x => toID(x) === toID(a)); if (f) slot.ability = f; }
      else if (/^(EVs|SPs):/i.test(l)) evLine = l.split(':')[1];
      else if (/Nature$/i.test(l)) { const n = l.replace(/Nature$/i, '').trim(); if (NATURE_MAP[n]) slot.nature = n; }
      else if (/^-/.test(l)) {
        const mn = l.replace(/^-\s*/, '').split('/')[0].trim();
        const mv = getMove(mn);
        if (mv && ls.some(x => x.id === mv.id)) moves.push(mv.name); else errors.push(`${sp.name}: mossa "${mn}" non disponibile`);
      }
    }
    if (evLine) {
      const vals = {};
      for (const part of evLine.split('/')) {
        const m = part.trim().match(/^(\d+)\s+(HP|Atk|Def|SpA|SpD|Spe)$/i);
        if (m) { const key = Object.keys(STAT_SHORT_EN).find(k => STAT_SHORT_EN[k].toLowerCase() === m[2].toLowerCase()); vals[key] = parseInt(m[1]); }
      }
      const looksLikeEVs = Object.values(vals).some(v => v > SP_STAT_MAX);
      for (const k of STAT_KEYS) {
        let v = vals[k] || 0;
        if (looksLikeEVs) v = Math.floor((v + 4) / 8);
        slot.sp[k] = Math.min(SP_STAT_MAX, v);
      }
      let over = spTotal(slot.sp) - SP_TOTAL_MAX;
      for (const k of ['def','spd','hp','atk','spa','spe']) { if (over <= 0) break; const cut = Math.min(over, slot.sp[k]); slot.sp[k] -= cut; over -= cut; }
    }
    slot.moves = [...moves.slice(0, 4), null, null, null, null].slice(0, 4);
    out.push(slot);
  }
  return { slots: out.slice(0, 6), errors };
}

/* ============================================================
   MOTORE DI CALCOLO — @smogon/calc (Generazione 0 = Pokémon Champions)
   ============================================================ */
const CALC = window.calc;
const GEN = CALC && CALC.Generations ? CALC.Generations.get(0) : null;
const CALC_NAME_FIX = { 'Aegislash': 'Aegislash-Shield' };
const WEATHER_CALC = { none: undefined, sun: 'Sun', rain: 'Rain', sand: 'Sand', snow: 'Snow' };
const TERRAIN_CALC = { none: undefined, electric: 'Electric', grassy: 'Grassy', psychic: 'Psychic', misty: 'Misty' };
const WEATHER_OPTS = [
  { id:'none', label:'Nessuno' }, { id:'sun', label:'Sole' }, { id:'rain', label:'Pioggia' },
  { id:'sand', label:'Sabbia' }, { id:'snow', label:'Neve' },
];
const TERRAIN_OPTS = [
  { id:'none', label:'Off' }, { id:'electric', label:'Elettrico' }, { id:'grassy', label:'Erboso' },
  { id:'psychic', label:'Psichico' }, { id:'misty', label:'Nebbioso' },
];

// Costruisce un Pokémon per il calcolatore.
// opts: { mega:bool, boosts:{}, status:'brn'|'par'|'', hpPct:0-100, ability, item }
function makeCalcMon(slot, opts = {}) {
  const base = getSpecies(slot.species);
  const mega = opts.mega ? megaFormFor(slot.species, slot.item) : null;
  const sp = mega || base;
  const name = CALC_NAME_FIX[sp.name] || sp.name;
  const ability = opts.ability || (mega ? mega.abilities[0] : slot.ability) || sp.abilities[0];
  let item = opts.item !== undefined ? opts.item : (slot.item || undefined);
  const mon = new CALC.Pokemon(GEN, name, {
    level: 50, ability, item: item || undefined, nature: slot.nature || 'Hardy',
    evs: { ...EMPTY_SP, ...(slot.sp || {}) },
    boosts: opts.boosts || {}, status: opts.status || '',
    abilityOn: opts.abilityOn,
  });
  if (opts.hpPct !== undefined && opts.hpPct < 100) {
    mon.originalCurHP = Math.max(1, Math.floor(mon.maxHP() * opts.hpPct / 100));
  }
  return mon;
}

function makeField(env = {}) {
  return new CALC.Field({
    gameType: env.singles ? 'Singles' : 'Doubles',
    weather: WEATHER_CALC[env.weather || 'none'],
    terrain: TERRAIN_CALC[env.terrain || 'none'],
    attackerSide: new CALC.Side({ isHelpingHand: !!env.helpingHand, isTailwind: !!env.atkTailwind }),
    defenderSide: new CALC.Side({
      isReflect: env.screen === 'reflect' || env.screen === 'both',
      isLightScreen: env.screen === 'lightscreen' || env.screen === 'both',
      isAuroraVeil: env.screen === 'auroraveil',
      isFriendGuard: !!env.friendGuard,
      isTailwind: !!env.defTailwind,
    }),
  });
}

function flattenRolls(damage) {
  if (typeof damage === 'number') return Array(16).fill(damage);
  if (Array.isArray(damage) && Array.isArray(damage[0])) {
    // multi-colpo: somma per indice di roll
    const n = damage[0].length;
    return Array.from({ length: n }, (_, i) => damage.reduce((a, hit) => a + (hit[i] || 0), 0));
  }
  return damage.slice();
}

// Esegue un calcolo; restituisce sempre un oggetto (mai eccezioni).
function runCalc(attMon, defMon, moveName, env = {}, opts = {}) {
  const mv = getMove(moveName);
  const hp = defMon.maxHP();
  const cur = defMon.curHP();
  const emptyRes = (note, immune = false) => ({ move: mv, min: 0, max: 0, avg: 0, rolls: [], hp, cur, pctMin: 0, pctMax: 0, pctAvg: 0, ohko: 0, thko: 0, desc: note, immune, typeEff: 0 });
  if (!mv || mv.category === 'status' || !CALC) return emptyRes('mossa di stato');
  try {
    const move = new CALC.Move(GEN, mv.name, { isCrit: !!opts.crit, hits: opts.hits });
    const r = CALC.calculate(GEN, attMon, defMon, move, makeField(env));
    const rolls = flattenRolls(r.damage).sort((a, b) => a - b);
    const max = rolls[rolls.length - 1] || 0;
    const effType = (r.move && r.move.type ? r.move.type : mv.type).toLowerCase();
    const defTypes = (r.defender && r.defender.types ? r.defender.types : []).map(t => String(t).toLowerCase());
    const typeEff = typeMult(effType, defTypes);
    if (max === 0) return { ...emptyRes(typeEff === 0 ? 'immune per tipo' : 'nessun danno (abilità/oggetto)', true), typeEff };
    const min = rolls[0];
    const avg = rolls.reduce((a, b) => a + b, 0) / rolls.length;
    let ohko = rolls.filter(x => x >= cur).length / rolls.length;
    let thko;
    if (2 * min >= cur) thko = 1; else if (2 * max < cur) thko = 0;
    else { let hits = 0; for (const a of rolls) for (const b of rolls) if (a + b >= cur) hits++; thko = hits / (rolls.length * rolls.length); }
    let desc = '';
    try { desc = r.desc(); } catch { desc = ''; }
    // Focus Sash / Sturdy: a PS pieni un singolo colpo non può mandare KO
    let survives = null;
    if (cur === hp && !mv.multihit && (defMon.item === 'Focus Sash' || defMon.ability === 'Sturdy') && ohko > 0) {
      survives = defMon.item === 'Focus Sash' ? 'Focus Sash' : 'Sturdy';
      ohko = 0;
    }
    return {
      move: mv, moveType: effType, min, max, avg, rolls, hp, cur,
      pctMin: min / hp * 100, pctMax: max / hp * 100, pctAvg: avg / hp * 100,
      ohko, thko, desc, immune: false, typeEff, survives,
    };
  } catch (e) {
    return emptyRes('errore di calcolo: ' + (e.message || e));
  }
}

/* ============================================================
   VELOCITÀ EFFETTIVA (per ordine di attacco)
   ============================================================ */
function effectiveSpeed(slot, ctx = {}) {
  const { mega = false, weather = 'none', terrain = 'none', tailwind = false, boost = 0, itemConsumed = false, paralyzed = false } = ctx;
  const sp = (mega && megaFormFor(slot.species, slot.item)) || getSpecies(slot.species);
  const ability = mega && megaFormFor(slot.species, slot.item) ? sp.abilities[0] : slot.ability;
  let s = champStat('spe', sp.bs.spe, slot.sp?.spe || 0, slot.nature);
  s = Math.floor(s * stageMult(boost));
  let mult = 1;
  if (tailwind) mult *= 2;
  if ((ability === 'Swift Swim' && weather === 'rain') || (ability === 'Chlorophyll' && weather === 'sun') ||
      (ability === 'Sand Rush' && weather === 'sand') || (ability === 'Slush Rush' && weather === 'snow') ||
      (ability === 'Surge Surfer' && terrain === 'electric') || (ability === 'Unburden' && itemConsumed)) mult *= 2;
  if (!itemConsumed && slot.item === 'Choice Scarf') mult *= 1.5;
  if (!itemConsumed && slot.item === 'Iron Ball') mult *= 0.5;
  s = Math.floor(s * mult);
  if (paralyzed) s = Math.floor(s / 2);
  return s;
}

/* ===== 02-matchup.jsx ===== */
/* ============================================================
   MATCHUP ENGINE — logica 1v1 e lead 2v2 (risk-aware)
   ============================================================ */
const WEATHER_ABILITIES = { 'Drizzle':'rain', 'Drought':'sun', 'Sand Stream':'sand', 'Snow Warning':'snow' };
const TERRAIN_ABILITIES = { 'Grassy Surge':'grassy', 'Psychic Surge':'psychic', 'Electric Surge':'electric', 'Misty Surge':'misty' };
const SEED_TERRAIN = { 'Grassy Seed':['grassy','def'], 'Electric Seed':['electric','def'], 'Psychic Seed':['psychic','spd'], 'Misty Seed':['misty','spd'] };
const INTIMIDATE_IMMUNE = new Set(['Clear Body','White Smoke','Hyper Cutter','Full Metal Body','Inner Focus','Own Tempo','Oblivious','Scrappy']);

// Abilità "attive" di uno slot in battaglia: base all'entrata + mega dopo l'evoluzione
function battleAbilities(slot, mega) {
  const list = [slot.ability];
  const m = mega ? megaFormFor(slot.species, slot.item) : null;
  if (m) list.push(m.abilities[0]);
  return list;
}
function isGroundedSlot(slot, mega) {
  const sp = (mega && megaFormFor(slot.species, slot.item)) || getSpecies(slot.species);
  const ab = battleAbilities(slot, mega);
  return !sp.types.includes('flying') && !ab.includes('Levitate') && slot.item !== 'Air Balloon';
}

/* Meteo/terreno automatici dai Pokémon in campo.
   Se due setter si scontrano vince il più lento (entra in gioco per ultimo);
   a parità di velocità vince quello avversario (scelta prudente). */
function autoField(units, override = {}) {
  const env = { weather: 'none', terrain: 'none' };
  const setters = { weather: [], terrain: [] };
  for (const u of units) {
    const spe = effectiveSpeed(u.slot, { mega: u.mega });
    for (const ab of battleAbilities(u.slot, u.mega)) {
      if (WEATHER_ABILITIES[ab]) setters.weather.push({ v: WEATHER_ABILITIES[ab], spe, opp: !!u.opp });
      if (TERRAIN_ABILITIES[ab]) setters.terrain.push({ v: TERRAIN_ABILITIES[ab], spe, opp: !!u.opp });
    }
  }
  for (const k of ['weather', 'terrain']) {
    if (override[k] && override[k] !== 'auto') { env[k] = override[k]; continue; }
    const list = setters[k].sort((a, b) => b.spe - a.spe || (a.opp ? 1 : 0) - (b.opp ? 1 : 0));
    if (list.length) env[k] = list[list.length - 1].v;
  }
  return env;
}

// Stato iniziale di uno slot dopo l'entrata: Intimidate subiti, semi, Unburden
function entryState(slot, mega, foes, env) {
  const boosts = {};
  const notes = [];
  let itemConsumed = false;
  const ab = slot.ability; // all'entrata conta l'abilità base
  const intimidators = foes.filter(f => f.slot.ability === 'Intimidate');
  for (const f of intimidators) {
    const name = displayName(f.slot);
    if (INTIMIDATE_IMMUNE.has(ab)) { notes.push(`${ab} blocca Intimidate di ${name}`); continue; }
    if (ab === 'Defiant') { boosts.atk = (boosts.atk || 0) + 1; notes.push(`Defiant: +1 Att netto contro Intimidate`); continue; }
    if (ab === 'Guard Dog') { boosts.atk = (boosts.atk || 0) + 1; notes.push(`Guard Dog: +1 Att da Intimidate`); continue; }
    if (ab === 'Contrary') { boosts.atk = (boosts.atk || 0) + 1; continue; }
    boosts.atk = (boosts.atk || 0) - 1;
    if (ab === 'Competitive') { boosts.spa = (boosts.spa || 0) + 2; notes.push('Competitive: +2 AttSp da Intimidate'); }
    if (ab === 'Rattled') boosts.spe = (boosts.spe || 0) + 1;
  }
  const seed = SEED_TERRAIN[slot.item];
  if (seed && env.terrain === seed[0]) {
    boosts[seed[1]] = (boosts[seed[1]] || 0) + 1;
    itemConsumed = true;
    notes.push(`${slot.item}: +1 ${STAT_LABELS[seed[1]]}${ab === 'Unburden' ? ' e Unburden attivo (Vel ×2)' : ''}`);
  }
  for (const k of Object.keys(boosts)) boosts[k] = Math.max(-6, Math.min(6, boosts[k]));
  return { boosts, itemConsumed, notes };
}

function damagingMoves(slot) {
  return (slot.moves || []).filter(Boolean).map(getMove).filter(m => m && m.category !== 'status' && m.bp > 0);
}

// Miglior colpo di A su B (massimizza danno atteso pesato col KO)
function bestHit(att, def, attState, defState, env, attMega, defMega) {
  let best = null;
  const attMon = makeCalcMon(att, { mega: attMega, boosts: attState.boosts, item: attState.itemConsumed ? '' : undefined, abilityOn: attState.itemConsumed });
  const defMon = makeCalcMon(def, { mega: defMega, boosts: defState.boosts, item: defState.itemConsumed ? '' : undefined });
  for (const mv of damagingMoves(att)) {
    if (mv.id === 'fakeout') continue; // utile solo al turno 1, non come colpo principale
    const r = runCalc(attMon, defMon, mv.name, env);
    const value = Math.min(100, r.pctAvg) + 25 * r.ohko;
    if (!best || value > best.value) best = { ...r, value };
  }
  return best;
}

function priorityOf(mv, env, attackerSlot) {
  let p = mv.priority || 0;
  if (mv.id === 'grassyglide' && env.terrain === 'grassy') p += 1;
  return p;
}

/* Valuta il 1v1 "me" contro "opp". Score positivo = buono per me.
   Componenti:
   - differenza di danno atteso (media dei 16 roll, max 100%), scontata
     dalla probabilità di essere messo KO prima di colpire
   - chi muove per primo (±10), Trick Room inverte
   - probabilità di OHKO (±20 × probabilità)
   - priorità utilizzabile solo da una parte (±6; Psychic Terrain la blocca)
   - immunità totale ai colpi dell'altro (±10)                                  */
function evaluateMatchup(me, opp, ctx = {}) {
  const { meMega = false, oppMega = false, field = {}, trickRoom = false, myTailwind = false, oppTailwind = false } = ctx;
  const env = autoField([{ slot: me, mega: meMega }, { slot: opp, mega: oppMega, opp: true }], field);
  const meState = entryState(me, meMega, [{ slot: opp }], env);
  const oppState = entryState(opp, oppMega, [{ slot: me }], env);
  const notes = [...meState.notes.map(n => 'Io · ' + n), ...oppState.notes.map(n => 'Lui · ' + n)];
  if (env.weather !== 'none') notes.push(`Meteo: ${WEATHER_OPTS.find(w => w.id === env.weather)?.label}`);
  if (env.terrain !== 'none') notes.push(`Terreno: ${TERRAIN_OPTS.find(w => w.id === env.terrain)?.label}`);

  const myHit = bestHit(me, opp, meState, oppState, env, meMega, oppMega);
  const oppHit = bestHit(opp, me, oppState, meState, env, oppMega, meMega);

  const mySpeed = effectiveSpeed(me, { mega: meMega, weather: env.weather, terrain: env.terrain, tailwind: myTailwind, boost: meState.boosts.spe, itemConsumed: meState.itemConsumed });
  const oppSpeed = effectiveSpeed(opp, { mega: oppMega, weather: env.weather, terrain: env.terrain, tailwind: oppTailwind, boost: oppState.boosts.spe, itemConsumed: oppState.itemConsumed });
  let speedSign = Math.sign(mySpeed - oppSpeed);
  if (trickRoom) speedSign = -speedSign;

  // priorità: conta solo se il colpo con priorità fa danni veri (≥ 25% atteso)
  const usablePriority = (att, def, attMega, defMega, attState, defState) => {
    if (env.terrain === 'psychic' && isGroundedSlot(def, defMega)) return false;
    const attMon = makeCalcMon(att, { mega: attMega, boosts: attState.boosts });
    const defMon = makeCalcMon(def, { mega: defMega, boosts: defState.boosts });
    return damagingMoves(att).some(mv => mv.id !== 'fakeout' && priorityOf(mv, env, att) > 0 && runCalc(attMon, defMon, mv.name, env).pctAvg >= 25);
  };
  const myPrio = usablePriority(me, opp, meMega, oppMega, meState, oppState);
  const oppPrio = usablePriority(opp, me, oppMega, meMega, oppState, meState);
  if (myPrio && !oppPrio && speedSign < 0) notes.push('Ho una mossa con priorità che scavalca la sua velocità');
  if (oppPrio && !myPrio && speedSign > 0) notes.push('Ha una mossa con priorità che scavalca la mia velocità');

  const pMe = myHit ? myHit.ohko : 0;
  const pOpp = oppHit ? oppHit.ohko : 0;
  const iMoveFirst = speedSign > 0 || (myPrio && !oppPrio);
  const heMovesFirst = speedSign < 0 || (oppPrio && !myPrio);
  let myExp = Math.min(100, myHit ? myHit.pctAvg : 0);
  let oppExp = Math.min(100, oppHit ? oppHit.pctAvg : 0);
  let myKO = pMe, oppKO = pOpp;
  if (heMovesFirst && !iMoveFirst) { myExp *= (1 - pOpp); myKO *= (1 - pOpp); }
  if (iMoveFirst && !heMovesFirst) { oppExp *= (1 - pMe); oppKO *= (1 - pMe); }

  let score = (myExp - oppExp) + 10 * speedSign + 20 * (myKO - oppKO);
  if (myPrio && !oppPrio) score += 6;
  if (oppPrio && !myPrio) score -= 6;
  const oppHasDamage = damagingMoves(opp).length > 0;
  if (oppHasDamage && (!oppHit || oppHit.max === 0)) { score += 10; notes.push('Sono immune ai suoi attacchi'); }
  if (damagingMoves(me).length > 0 && (!myHit || myHit.max === 0)) { score -= 10; notes.push('È immune ai miei attacchi'); }

  return {
    score: Math.round(score), myHit, oppHit, mySpeed, oppSpeed, speedSign,
    myPct: Math.round(myHit ? myHit.pctAvg : 0), oppPct: Math.round(oppHit ? oppHit.pctAvg : 0),
    notes, env, meMega, oppMega, trickRoom,
  };
}

/* Griglia con cache: per ogni coppia (mio slot, sua slot) e stato mega.
   I portatori di Mega Stone sono valutati sia in forma Mega che base,
   perché in battaglia si può megaevolvere un solo Pokémon. */
function useMatchupEngine(team, opponentTeam, options) {
  const cacheRef = useRef(new Map());
  const sig = JSON.stringify([team, opponentTeam, options]);
  const lastSig = useRef('');
  if (lastSig.current !== sig) { cacheRef.current = new Map(); lastSig.current = sig; }
  return useCallback((mi, oi, meMega, oppMega, fieldOverride) => {
    const field = fieldOverride || options.field;
    const key = `${mi}:${meMega ? 1 : 0}|${oi}:${oppMega ? 1 : 0}|${field.weather}|${field.terrain}`;
    const c = cacheRef.current;
    if (!c.has(key)) c.set(key, evaluateMatchup(team[mi], opponentTeam[oi], { ...options, meMega, oppMega, field }));
    return c.get(key);
  }, [sig]);
}

// Lead advisor: ogni coppia mia contro ogni coppia avversaria (2v2 completo).
// pairScore = (A·C + A·D + B·C + B·D) / 2 — nessuna assegnazione ottimistica.
// Vincolo Mega: io scelgo chi megaevolvere (max), l'avversario sceglie il suo (min per me).
// Composito = 70% media + 30% caso peggiore (scelta di design: gestione del rischio).
function computeLeads(team, opponentTeam, evalFn, options) {
  const mine = team.map((s, i) => ({ s, i })).filter(x => slotIsLegal(x.s));
  const theirs = opponentTeam.map((s, i) => ({ s, i })).filter(x => slotIsLegal(x.s));
  if (mine.length < 2 || theirs.length < 2) return [];
  const megaOpts = slot => slotMega(slot) ? [true, false] : [false];
  const out = [];
  for (let a = 0; a < mine.length; a++) for (let b = a + 1; b < mine.length; b++) {
    const A = mine[a], B = mine[b];
    // combinazioni mega mie (al massimo una)
    const myCombos = [];
    for (const ma of megaOpts(A.s)) for (const mb of megaOpts(B.s)) if (!(ma && mb)) myCombos.push([ma, mb]);
    const vs = [];
    for (let c = 0; c < theirs.length; c++) for (let d = c + 1; d < theirs.length; d++) {
      const C = theirs[c], D = theirs[d];
      const oppCombos = [];
      for (const mc of megaOpts(C.s)) for (const md of megaOpts(D.s)) if (!(mc && md)) oppCombos.push([mc, md]);
      // campo deciso dai 4 in campo (se non forzato)
      let bestMine = -Infinity, bestDetail = null;
      for (const [ma, mb] of myCombos) {
        let worstOpp = Infinity, worstDetail = null;
        for (const [mc, md] of oppCombos) {
          const field = autoField([
            { slot: A.s, mega: ma }, { slot: B.s, mega: mb },
            { slot: C.s, mega: mc, opp: true }, { slot: D.s, mega: md, opp: true },
          ], options.field);
          const s = (evalFn(A.i, C.i, ma, mc, field).score + evalFn(A.i, D.i, ma, md, field).score +
                     evalFn(B.i, C.i, mb, mc, field).score + evalFn(B.i, D.i, mb, md, field).score) / 2;
          if (s < worstOpp) { worstOpp = s; worstDetail = { mc, md, field }; }
        }
        if (worstOpp > bestMine) { bestMine = worstOpp; bestDetail = { ma, mb, ...worstDetail }; }
      }
      vs.push({ c: C.i, d: D.i, score: bestMine, detail: bestDetail });
    }
    const avg = vs.reduce((x, y) => x + y.score, 0) / vs.length;
    const worst = vs.reduce((x, y) => (y.score < x.score ? y : x), vs[0]);
    const best = vs.reduce((x, y) => (y.score > x.score ? y : x), vs[0]);
    const composite = avg * 0.7 + worst.score * 0.3;
    // mega consigliata: quella scelta più spesso
    const megaPick = { a: 0, b: 0 };
    for (const v of vs) { if (v.detail?.ma) megaPick.a++; if (v.detail?.mb) megaPick.b++; }
    out.push({ mA: A.i, mB: B.i, avg: Math.round(avg), worst: Math.round(worst.score), worstPair: [worst.c, worst.d],
      bestPair: [best.c, best.d], composite: Math.round(composite), megaPick });
  }
  return out.sort((x, y) => y.composite - x.composite);
}

function spriteSources(speciesName, small = false) {
  const sp = getSpecies(speciesName);
  if (!sp) return [];
  const base = sp.isMega ? getSpecies(sp.megaBase) : sp.battleOnly ? getSpecies(sp.battleOnly) : sp;
  const ids = [sp.spriteid, base && base.spriteid].filter(Boolean);
  const urls = [];
  for (const id of [...new Set(ids)]) {
    if (small) urls.push(`https://play.pokemonshowdown.com/sprites/gen5/${id}.png`);
    urls.push(`https://play.pokemonshowdown.com/sprites/home-centered/${id}.png`);
    urls.push(`https://play.pokemonshowdown.com/sprites/dex/${id}.png`);
    if (!small) urls.push(`https://play.pokemonshowdown.com/sprites/gen5/${id}.png`);
  }
  urls.push(`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${sp.num}.png`);
  return urls;
}
function Sprite({ species, small = false, className = '', style }) {
  const srcs = useMemo(() => spriteSources(species, small), [species, small]);
  const [i, setI] = useState(0);
  useEffect(() => setI(0), [species]);
  if (!srcs.length || i >= srcs.length) return <div className={className} style={style}><PokeballGlyph size={28} /></div>;
  return <img src={srcs[i]} alt={species} loading="lazy" onError={() => setI(x => x + 1)}
    className={className} style={{ imageRendering: small ? 'pixelated' : 'auto', ...style }} />;
}

            <span className="flex gap-0.5 flex-shrink-0 ml-1">{[0,1,2,3].map(i => <span key={i} className="w-1.5 h-1.5 rounded-full" style={{ background: i < filled ? CYAN : '#2a2a3d' }} />)}</span>
          </div>
        </div>
      </div>
    </button>
  );
}

/* ============================================================
   EDITOR STAT POINTS (66 totali, max 32 per statistica)
   ============================================================ */
function SPEditor({ slot, onChange }) {
  const sp = slotSpecies(slot);
  const mega = slotMega(slot);
  const total = spTotal(slot.sp);
  const remaining = SP_TOTAL_MAX - total;
  function setSP(stat, val) {
    val = Math.max(0, Math.min(SP_STAT_MAX, Math.round(val) || 0));
    const other = total - (slot.sp[stat] || 0);
    val = Math.min(val, SP_TOTAL_MAX - other);
    onChange({ ...slot.sp, [stat]: val });
  }
  const pct = total / SP_TOTAL_MAX * 100;
  return (
    <div>
      <div className="flex items-center gap-3 mb-3">
        <div className="relative w-12 h-12 flex-shrink-0">
          <svg viewBox="0 0 36 36" className="w-12 h-12 -rotate-90">
            <circle cx="18" cy="18" r="15.5" fill="none" stroke="#1f1f30" strokeWidth="3.5" />
            <circle cx="18" cy="18" r="15.5" fill="none" stroke={remaining === 0 ? CYAN : PINK} strokeWidth="3.5"
              strokeDasharray={`${pct * 0.974} 100`} strokeLinecap="round" style={{ transition: 'stroke-dasharray .3s' }} />
          </svg>
          <div className="absolute inset-0 flex items-center justify-center font-mono text-[11px] font-bold text-stone-100">{total}</div>
        </div>
        <div className="flex-1">
          <div className="font-mono text-[10px] text-stone-400 tracking-widest">STAT POINTS · {total}/{SP_TOTAL_MAX}</div>
          <div className="font-body text-xs text-stone-500">{remaining > 0 ? `${remaining} punti da assegnare` : 'tutti assegnati'} · 1 punto = +1 alla statistica</div>
        </div>
        <button onClick={() => onChange({ ...EMPTY_SP })} className="font-mono text-[9px] px-2 py-1 rounded hud-btn text-stone-400">azzera</button>
      </div>
      <div className="space-y-2">
        {STAT_KEYS.map(stat => {
          const v = slot.sp[stat] || 0;
          const final = champStat(stat, sp.bs[stat], v, slot.nature);
          const megaFinal = mega ? champStat(stat, mega.bs[stat], v, slot.nature) : null;
          const nm = natureMult(slot.nature, stat);
          return (
            <div key={stat} className="grid grid-cols-[3.2rem_1fr_auto] items-center gap-2">
              <div>
                <div className="font-mono text-[11px] font-semibold" style={{ color: STAT_COLORS[stat] }}>{STAT_LABELS[stat]}{nm > 1 ? '↑' : nm < 1 ? '↓' : ''}</div>
                <div className="font-mono text-[9px] text-stone-600">base {sp.bs[stat]}</div>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <StatBar stat={stat} value={final} mega={megaFinal} />
                  <span className={`font-mono text-sm w-9 text-right tabular-nums ${nm > 1 ? 'text-[#ff9ab3]' : nm < 1 ? 'text-sky-400' : 'text-stone-100'}`}>{final}</span>
                </div>
                {megaFinal !== null && megaFinal !== final && <div className="font-mono text-[9px] text-[#c4a7ff] text-right">mega {megaFinal}</div>}
              </div>
              <div className="flex items-center gap-1">
                <button onClick={() => setSP(stat, v - 1)} className="w-6 h-6 rounded hud-btn text-stone-400 font-mono text-xs">−</button>
                <input type="number" min={0} max={32} value={v} onChange={e => setSP(stat, parseInt(e.target.value))}
                  className="w-9 h-6 text-center font-mono text-xs rounded hud-input text-stone-100" />
                <button onClick={() => setSP(stat, v + 1)} className="w-6 h-6 rounded hud-btn text-stone-400 font-mono text-xs">+</button>
                <button onClick={() => setSP(stat, v >= SP_STAT_MAX ? 0 : SP_STAT_MAX)} className="w-8 h-6 rounded hud-btn font-mono text-[9px]" style={{ color: v >= SP_STAT_MAX ? CYAN : '#8a8aa3' }}>{v >= SP_STAT_MAX ? '0' : 'MAX'}</button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ============================================================
   SELETTORE MOSSA (learnset Champions)
   ============================================================ */
function MoveSlot({ moveName, species, taken, onChange, onClear }) {
  const [editing, setEditing] = useState(false);
  const [q, setQ] = useState('');
  const mv = moveName ? getMove(moveName) : null;
  const pool = useMemo(() => learnsetOf(species), [species]);
  const filtered = useMemo(() => {
    const t = toID(q);
    return pool.filter(m => !t || m.id.includes(t) || toID(TYPE_IT[m.type]).includes(t))
      .sort((a, b) => (b.bp || 0) - (a.bp || 0) || a.name.localeCompare(b.name)).slice(0, 80);
  }, [q, pool]);
  if (editing) {
    return (
      <div className="hud-panel rounded-xl p-2 space-y-2" style={{ borderColor: `${PINK}66` }}>
        <div className="flex items-center gap-2">
          <Search size={14} className="text-stone-500" />
          <input autoFocus value={q} onChange={e => setQ(e.target.value)} placeholder={`Cerca tra ${pool.length} mosse…`}
            className="flex-1 bg-transparent text-sm text-stone-100 outline-none placeholder-stone-600" />
          <button onClick={() => setEditing(false)} className="text-stone-500"><X size={14} /></button>
        </div>
        <div className="max-h-52 overflow-y-auto scrollbar">
          {filtered.map(m => (
            <button key={m.id} disabled={taken.includes(m.name)} onClick={() => { onChange(m.name); setEditing(false); setQ(''); }}
              className="w-full flex items-center gap-2 text-left text-sm py-1.5 px-2 hover:bg-white/[0.04] rounded disabled:opacity-30">
              <CategoryIcon category={m.category} size={13} />
              <span className="font-body text-stone-200 flex-1 truncate">{m.name}</span>
              <TypeBadge type={m.type} size="xs" />
              <span className="font-mono text-[10px] text-stone-500 w-12 text-right">{m.bp ? `${m.bp}` : '—'}{m.priority > 0 ? ` +${m.priority}` : ''}</span>
            </button>
          ))}
        </div>
      </div>
    );
  }
  if (!mv) {
    return (
      <button onClick={() => setEditing(true)} className="w-full rounded-xl px-3 py-2.5 text-left text-stone-500 text-sm font-body empty-move">+ aggiungi mossa</button>
    );
  }
  const c = TYPE_COLORS[mv.type];
  return (
    <div className="move-chip flex items-center gap-2 rounded-xl px-2.5 py-2" style={{ '--mc': c }}>
      <button onClick={() => setEditing(true)} className="flex-1 flex items-center gap-2 text-left min-w-0">
        <CategoryIcon category={mv.category} />
        <span className="font-body text-sm text-stone-100 truncate">{mv.name}</span>
        {SPREAD_TARGETS.has(mv.target) && <span className="font-mono text-[8px] px-1 rounded text-stone-300 bg-white/10">SPREAD</span>}
        {mv.priority > 0 && <span className="font-mono text-[8px] px-1 rounded" style={{ background: `${CYAN}25`, color: CYAN }}>+{mv.priority}</span>}
      </button>
      <TypeBadge type={mv.type} size="xs" />
      <span className="font-mono text-[10px] text-stone-400 w-8 text-right">{mv.bp || '—'}</span>
      <button onClick={onClear} className="text-stone-600 hover:text-red-400"><X size={12} /></button>
    </div>
  );
}

          <button onClick={() => {

function ResultCard({ res, attackerName, defenderName }) {
  if (!res) return null;
  if (res.immune || res.max === 0) {
    return (
      <Panel className="p-5 text-center">
        <div className="font-display text-3xl text-stone-400">Nessun danno</div>
        <div className="font-body text-xs text-stone-500 mt-1">{res.desc}</div>
      </Panel>
    );
  }
  const remainMin = Math.max(0, (res.cur - res.max) / res.hp * 100);
  const remainMax = Math.max(0, (res.cur - res.min) / res.hp * 100);
  const koLabel = res.survives ? `resiste con 1 PS (${res.survives}) · ${res.thko >= 1 ? '2HKO garantito' : (res.thko * 100).toFixed(0) + '% di 2HKO'}` : res.ohko >= 1 ? 'OHKO garantito' : res.ohko > 0 ? `${(res.ohko * 100).toFixed(1)}% di OHKO` :
    res.thko >= 1 ? '2HKO garantito' : res.thko > 0 ? `${(res.thko * 100).toFixed(1)}% di 2HKO` : 'non va KO in 2 colpi';
  const koColor = res.ohko > 0 ? '#ff7272' : res.thko > 0 ? '#f5c518' : '#8a8aa3';
  return (
    <Panel className="p-4 space-y-3" glow={TYPE_COLORS[res.moveType] || PINK}>
      <div className="flex items-start justify-between gap-2">
        <div>
          <div className="font-mono text-[9px] tracking-[0.3em] text-stone-500">RISULTATO</div>
          <div className="flex items-baseline gap-2">
            <span className="font-display text-[44px] leading-none text-stone-50 tabular-nums">{res.pctMin.toFixed(1)}–{res.pctMax.toFixed(1)}%</span>
          </div>
          <div className="font-mono text-xs text-stone-400 mt-1">{res.min}–{res.max} danni su {res.cur}/{res.hp} PS</div>
        </div>
        <div className="text-right">
          <TypeBadge type={res.moveType} size="sm" />
          <div className="font-mono text-[10px] text-stone-500 mt-1">efficacia ×{res.typeEff}</div>
        </div>
      </div>
      <HPBar pctAfterMin={remainMax} pctAfterMax={remainMin} />
      <div className="flex items-center justify-between">
        <span className="font-body text-sm font-semibold" style={{ color: koColor }}>{koLabel}</span>
        {res.ohko < 1 && res.thko > 0 && res.ohko > 0 && <span className="font-mono text-[10px] text-stone-500">2HKO {(res.thko * 100).toFixed(0)}%</span>}
      </div>
      <details className="group">
        <summary className="font-mono text-[10px] text-stone-500 cursor-pointer select-none">dettagli calcolo (Showdown) ▾</summary>
        <div className="font-mono text-[10px] text-stone-400 mt-2 leading-relaxed">{res.desc}</div>
        <div className="font-mono text-[10px] text-stone-600 mt-1">roll: {res.rolls.join(', ')}</div>
      </details>
    </Panel>
  );
}

function DamageCalculator({ team, opponentTeam }) {
  const [dir, setDir] = useState('out'); // out: io → avversario · in: avversario → io
  const [attKey, setAttKey] = useState(null);
  const [defKey, setDefKey] = useState(null);
  const [custom, setCustom] = useState(null);
  const [searchOpen, setSearchOpen] = useState(false);
  const [moveIdx, setMoveIdx] = useState(0);
  const [attMega, setAttMega] = useState(false);
  const [defMega, setDefMega] = useState(false);
  const [attAbility, setAttAbility] = useState(null);
  const [atkStage, setAtkStage] = useState(0);
  const [defStage, setDefStage] = useState(0);
  const [burn, setBurn] = useState(false);
  const [crit, setCrit] = useState(false);
  const [helping, setHelping] = useState(false);
  const [weather, setWeather] = useState('none');
  const [terrain, setTerrain] = useState('none');
  const [screen, setScreen] = useState('none');
  const [hpPct, setHpPct] = useState(100);

  const atkSide = dir === 'out' ? team : opponentTeam;
  const defSide = dir === 'out' ? opponentTeam : team;
  const attList = atkSide.map((s, i) => ({ slot: s, key: 'a' + i })).filter(x => slotIsLegal(x.slot));
  const defList = defSide.map((s, i) => ({ slot: s, key: 'd' + i })).filter(x => slotIsLegal(x.slot));
  if (custom) defList.push({ slot: custom, key: 'custom', label: custom.species + ' ✎' });

  const attacker = attList.find(x => x.key === attKey)?.slot || attList[0]?.slot || null;
  const defender = defList.find(x => x.key === defKey)?.slot || defList[0]?.slot || null;
  const attEntry = attList.find(x => x.slot === attacker);
  const defEntry = defList.find(x => x.slot === defender);

  useEffect(() => { setAttMega(false); setAttAbility(null); setAtkStage(0); setMoveIdx(0); setBurn(false); }, [attacker?.species, dir]);
  useEffect(() => { setDefMega(false); setDefStage(0); setHpPct(100); }, [defender?.species, dir]);

  const moves = attacker ? (attacker.moves || []).map(m => m && getMove(m)) : [];
  const move = moves[moveIdx] && moves[moveIdx].category !== 'status' ? moves[moveIdx] : null;
  const isPhys = move?.category === 'physical';
  const atkKeyStat = isPhys ? 'atk' : 'spa';
  const defKeyStat = isPhys ? 'def' : 'spd';
  const attMegaForm = attacker ? slotMega(attacker) : null;
  const defMegaForm = defender ? slotMega(defender) : null;
  const abilityChoices = attacker ? [...new Set([...(attMega && attMegaForm ? attMegaForm.abilities : getSpecies(attacker.species).abilities)])] : [];
  const effAbility = attAbility && abilityChoices.includes(attAbility) ? attAbility : (attMega && attMegaForm ? attMegaForm.abilities[0] : attacker?.ability);

  const env = { weather, terrain, screen, helpingHand: helping };
  const results = useMemo(() => {
    if (!attacker || !defender) return [];
    const a = makeCalcMon(attacker, { mega: attMega, ability: effAbility, boosts: move ? { [atkKeyStat]: atkStage } : {}, status: burn ? 'brn' : '' });
    const d = makeCalcMon(defender, { mega: defMega, boosts: move ? { [defKeyStat]: defStage } : {}, hpPct });
    return moves.map(mv => mv && mv.category !== 'status' ? runCalc(a, d, mv.name, env, { crit }) : null);
  }, [attacker, defender, attMega, defMega, effAbility, atkStage, defStage, burn, crit, hpPct, weather, terrain, screen, helping, moveIdx, dir]);
  const res = results[moveIdx];

  if (attList.length === 0) {
    return (
      <div className="py-20 text-center">
        <Calculator size={28} className="mx-auto text-stone-700 mb-3" />
        <p className="font-body text-stone-500 text-sm">{dir === 'out' ? 'Aggiungi Pokémon al tuo team' : 'Aggiungi un team avversario nel Matchup'} per usare il calcolatore</p>
        {dir === 'in' && <button onClick={() => setDir('out')} className="mt-3 text-xs underline text-stone-400">torna a Io → Avversario</button>}
      </div>
    );
  }

  return (
    <div className="space-y-4 fade-up">
      <div className="flex items-center justify-between">
        <Segmented options={[{ id: 'out', label: 'Io → Avversario' }, { id: 'in', label: 'Avversario → Io' }]} value={dir}
          onChange={v => { setDir(v); setAttKey(null); setDefKey(null); }} />
        <span className="font-mono text-[9px] text-stone-500 text-right leading-tight">motore<br/>Showdown</span>
      </div>

      <div>
        <div className="font-mono text-[10px] tracking-[0.25em] mb-2" style={{ color: `${PINK}bb` }}>ATTACCANTE</div>
        <MonPicker list={attList} value={attEntry?.key} onPick={setAttKey} accent={PINK} />
        {attacker && (
          <div className="mt-2 space-y-2">
            <div className="grid grid-cols-2 gap-1.5">
              {[0, 1, 2, 3].map(i => {
                const m = moves[i];
                if (!m) return <div key={i} className="rounded-lg border border-dashed border-[#26263a] py-2 text-center font-mono text-[10px] text-stone-700">—</div>;
                const r = results[i];
                const sel = moveIdx === i;
                return (
                  <button key={i} onClick={() => setMoveIdx(i)} disabled={m.category === 'status'}
                    className="rounded-lg px-2 py-1.5 text-left transition disabled:opacity-40"
                    style={sel ? { background: `${TYPE_COLORS[m.type]}22`, border: `1px solid ${TYPE_COLORS[m.type]}` } : { background: '#12121d', border: '1px solid #26263a' }}>
                    <div className="flex items-center gap-1.5">
                      <CategoryIcon category={m.category} size={12} />
                      <span className="font-body text-xs text-stone-100 truncate">{m.name}</span>
                    </div>
                    <div className="font-mono text-[9px] text-stone-500 mt-0.5">
                      {m.category === 'status' ? 'stato' : r && !r.immune ? `${r.pctMin.toFixed(0)}–${r.pctMax.toFixed(0)}%` : r ? 'immune' : ''}
                      {SPREAD_TARGETS.has(m.target) ? ' · spread' : ''}
                    </div>
                  </button>
                );
              })}
            </div>
            <div className="flex flex-wrap items-center gap-1.5">
              {attMegaForm && <Toggle active={attMega} onClick={() => { setAttMega(!attMega); setAttAbility(null); }} color="#a78bfa">✦ Mega</Toggle>}
              {isPhys && <Toggle active={burn} onClick={() => setBurn(!burn)}>Scottato</Toggle>}
              <Toggle active={crit} onClick={() => setCrit(!crit)}>Brutto colpo</Toggle>
              <Toggle active={helping} onClick={() => setHelping(!helping)}>Altruismo</Toggle>
            </div>
            <div className="grid grid-cols-2 gap-2 items-end">
              <Field label="Abilità attaccante">
                <select value={effAbility || ''} onChange={e => setAttAbility(e.target.value)} className={selectCls + ' !py-1.5 !text-xs'}>
                  {abilityChoices.map(a => <option key={a}>{a}</option>)}
                </select>
              </Field>
              {move && <StageControls label={`Stadio ${STAT_LABELS[atkKeyStat]}`} value={atkStage} onChange={setAtkStage} />}
            </div>
          </div>
        )}
      </div>

      <div>
        <div className="flex items-center justify-between mb-2">
          <div className="font-mono text-[10px] tracking-[0.25em]" style={{ color: `${CYAN}cc` }}>DIFENSORE</div>
          <button onClick={() => setSearchOpen(true)} className="font-mono text-[10px] text-stone-400 hover:text-stone-100">+ altro Pokémon</button>
        </div>
        {defList.length === 0 ? (
          <button onClick={() => setSearchOpen(true)} className="w-full py-4 rounded-xl empty-move font-body text-sm text-stone-400">+ scegli un difensore</button>
        ) : (
          <MonPicker list={defList} value={defEntry?.key} onPick={setDefKey} accent={CYAN} />
        )}
        {defender && (
          <div className="mt-2 space-y-2">
            {defEntry?.key === 'custom' && <CustomDefenderEditor slot={custom} onChange={setCustom} />}
            <div className="flex flex-wrap items-center gap-2">
              {defMegaForm && <Toggle active={defMega} onClick={() => setDefMega(!defMega)} color="#a78bfa">✦ Mega</Toggle>}
              {move && <StageControls label={`Stadio ${STAT_LABELS[defKeyStat]}`} value={defStage} onChange={setDefStage} />}
            </div>
            <div>
              <div className="flex items-baseline justify-between">
                <span className="font-mono text-[9.5px] text-stone-500 tracking-[0.18em]">PS ATTUALI</span>
                <span className="font-mono text-[10px] text-stone-400">{hpPct}%</span>
              </div>
              <input type="range" min={1} max={100} value={hpPct} onChange={e => setHpPct(parseInt(e.target.value))} className="w-full mt-1 hud-range" />
            </div>
          </div>
        )}
      </div>

      <div className="space-y-2">
        <div className="font-mono text-[10px] text-stone-500 tracking-[0.25em]">CAMPO</div>
        <div className="flex items-center gap-2 flex-wrap"><span className="font-mono text-[10px] text-stone-500 w-14">Meteo</span><Segmented small options={WEATHER_OPTS} value={weather} onChange={setWeather} /></div>
        <div className="flex items-center gap-2 flex-wrap"><span className="font-mono text-[10px] text-stone-500 w-14">Terreno</span><Segmented small options={TERRAIN_OPTS} value={terrain} onChange={setTerrain} /></div>
        <div className="flex items-center gap-2 flex-wrap"><span className="font-mono text-[10px] text-stone-500 w-14">Schermi</span>
          <Segmented small options={[{ id: 'none', label: 'Off' }, { id: 'reflect', label: 'Riflesso' }, { id: 'lightscreen', label: 'Schermoluce' }, { id: 'auroraveil', label: 'Velo Aurora' }]} value={screen} onChange={setScreen} />
        </div>
      </div>

      {move && res && <ResultCard res={res} />}
      {!move && attacker && <div className="font-body text-xs text-stone-500 text-center py-4">Seleziona una mossa offensiva</div>}

      <SearchOverlay open={searchOpen} title="Difensore personalizzato" onClose={() => setSearchOpen(false)}
        onSelect={name => {
          const s = newSlot(name);
          s.sp = { ...EMPTY_SP, hp: 32, def: 17, spd: 17 };
          setCustom(s); setDefKey('custom');
        }} />
    </div>
  );
}

function buildPresetSlots(preset) {
  return preset.mons.map(m => {
    const s = newSlot(m.s);

    s.sp = { ...EMPTY_SP, ...m.sp };
    s.moves = [...m.moves, null, null, null, null].slice(0, 4);
    return s;
  });
}

/* ============================================================

   ============================================================ */
function MatchupSimulator({ team, opponentTeam, openOppSearch, onEditOpp, onRemoveOpp, onLoadPreset }) {
  const [view, setView] = useState('leads');
  const [detail, setDetail] = useState(null);
  const [weather, setWeather] = useState('auto');
  const [terrain, setTerrain] = useState('auto');
  const [trickRoom, setTrickRoom] = useState(false);
  const [myTailwind, setMyTailwind] = useState(false);
  const [oppTailwind, setOppTailwind] = useState(false);

  const myMembers = team.map((m, i) => ({ m, i })).filter(x => slotIsLegal(x.m));
  const oppMembers = opponentTeam.map((m, i) => ({ m, i })).filter(x => slotIsLegal(x.m));
  const options = { field: { weather, terrain }, trickRoom, myTailwind, oppTailwind };
  const evalFn = useMatchupEngine(team, opponentTeam, options);

  // Griglia 1v1: ogni portatore di Mega Stone è valutato in forma Mega
  const grid = useMemo(() => {
    if (!myMembers.length || !oppMembers.length) return null;
    const g = {};
    for (const { m, i } of myMembers) {
      g[i] = {};
      for (const { m: o, i: oi } of oppMembers) g[i][oi] = evalFn(i, oi, !!slotMega(m), !!slotMega(o));
    }
    return g;
  }, [evalFn]);

  const ranking = useMemo(() => {
    if (!grid) return [];
    return myMembers.map(({ m, i }) => {
      const scores = oppMembers.map(({ i: oi }) => grid[i][oi].score);
      const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
      return { idx: i, mon: m, avg: Math.round(avg), worst: Math.min(...scores), best: Math.max(...scores), composite: Math.round(avg * 0.7 + Math.min(...scores) * 0.3) };
    }).sort((a, b) => b.composite - a.composite);
  }, [grid]);

  const [leads, setLeads] = useState([]);
  const [computing, setComputing] = useState(false);
  useEffect(() => {
    if (myMembers.length < 2 || oppMembers.length < 2) { setLeads([]); return; }
    setComputing(true);
    const t = setTimeout(() => { setLeads(computeLeads(team, opponentTeam, evalFn, options)); setComputing(false); }, 30);
    return () => clearTimeout(t);
  }, [evalFn]);

  const fieldBar = (
    <div className="space-y-2">
      <div className="font-mono text-[10px] text-stone-500 tracking-[0.25em]">CAMPO</div>
      <div className="flex items-center gap-2 flex-wrap"><span className="font-mono text-[10px] text-stone-500 w-14">Meteo</span>
        <Segmented small options={[{ id: 'auto', label: 'Auto' }, ...WEATHER_OPTS]} value={weather} onChange={setWeather} /></div>
      <div className="flex items-center gap-2 flex-wrap"><span className="font-mono text-[10px] text-stone-500 w-14">Terreno</span>
        <Segmented small options={[{ id: 'auto', label: 'Auto' }, ...TERRAIN_OPTS]} value={terrain} onChange={setTerrain} /></div>
      <div className="flex items-center gap-1.5 flex-wrap">
        <Toggle active={trickRoom} onClick={() => setTrickRoom(!trickRoom)} color="#a78bfa">Trick Room</Toggle>
        <Toggle active={myTailwind} onClick={() => setMyTailwind(!myTailwind)} color={PINK}>Tailwind mio</Toggle>
        <Toggle active={oppTailwind} onClick={() => setOppTailwind(!oppTailwind)} color={CYAN}>Tailwind suo</Toggle>
      </div>
      <div className="font-mono text-[9px] text-stone-600">Auto = meteo e terreno decisi dalle abilità dei Pokémon in campo (vince il setter più lento).</div>
    </div>
  );

  if (myMembers.length === 0) {
    return (
      <div className="py-20 text-center">
        <Target size={28} className="mx-auto text-stone-700 mb-3" />
        <p className="font-body text-stone-500 text-sm">Costruisci prima il tuo team</p>
      </div>
    );
  }

  return (
    <div className="space-y-5 fade-up">
      <div>
        <div className="flex items-center justify-between mb-2">
          <div className="font-mono text-[10px] tracking-[0.25em]" style={{ color: `${CYAN}cc` }}>TEAM AVVERSARIO · {oppMembers.length}/6</div>
          <button onClick={() => setView(v => v === 'presets' ? 'leads' : 'presets')}
            className="font-mono text-[10px] px-2.5 py-1 rounded-lg"
            style={view === 'presets' ? { background: `${PINK}22`, border: `1px solid ${PINK}77`, color: PINK } : { background: '#12121d', border: '1px solid #2a2a3d', color: '#9a9ab5' }}>
            ◆ meta M-C
          </button>

const SPEED_CONTROL = new Set(['tailwind','trickroom','icywind','electroweb','thunderwave','scaryface','bulldoze','rocktomb','glare','stringshot','nuzzle','quash','afteryou']);
const REDIRECTION = new Set(['followme','ragepowder','allyswitch']);

function battleForm(slot) { return slotMega(slot) || slotSpecies(slot); }

function analyzeTeam(team) {
  const members = team.filter(slotIsLegal);
  if (!members.length) return null;
  const forms = members.map(battleForm);
  const defensive = {};
  for (const atk of TYPES) {
    let weak = 0, resist = 0, immune = 0;
    forms.forEach((f, i) => {
      let m = typeMult(atk, f.types);
      const ab = members[i].ability;
      if ((atk === 'ground' && ab === 'Levitate') || (atk === 'water' && ['Water Absorb','Storm Drain','Dry Skin'].includes(ab)) ||
          (atk === 'electric' && ['Volt Absorb','Lightning Rod','Motor Drive'].includes(ab)) || (atk === 'fire' && ['Flash Fire','Well-Baked Body'].includes(ab)) ||
          (atk === 'grass' && ab === 'Sap Sipper') || (atk === 'ground' && members[i].item === 'Air Balloon')) m = 0;
      if (m === 0) immune++; else if (m >= 2) weak++; else if (m < 1) resist++;
    });
    defensive[atk] = { weak, resist, immune };
  }
  const offensive = {};
  for (const def of TYPES) {
    let best = 0;
    members.forEach((s, i) => {
      for (const mv of damagingMoves(s)) {
        let t = mv.type;
        const ab = (slotMega(s) ? slotMega(s).abilities[0] : s.ability);
        if (t === 'normal' && { Pixilate: 'fairy', Aerilate: 'flying', Refrigerate: 'ice', Galvanize: 'electric', Dragonize: 'dragon' }[ab]) t = { Pixilate: 'fairy', Aerilate: 'flying', Refrigerate: 'ice', Galvanize: 'electric', Dragonize: 'dragon' }[ab];
        best = Math.max(best, typeMult(t, [def]));
      }
    });
    offensive[def] = best;
  }
  const issues = [];
  let risk = 0;
  const items = members.map(s => s.item).filter(Boolean);
  const dups = [...new Set(items.filter((it, i) => items.indexOf(it) !== i))];
  if (dups.length) { risk += 25; issues.push({ level: 'high', text: `Strumenti duplicati (vietato dal regolamento): ${dups.join(', ')}` }); }
  const shared = TYPES.filter(t => defensive[t].weak >= 3 || (defensive[t].weak >= 2 && defensive[t].resist + defensive[t].immune === 0));
  if (shared.length) { risk += shared.length * 8; issues.push({ level: 'high', text: `Debolezze condivise senza copertura: ${shared.map(t => TYPE_IT[t]).join(', ')}` }); }
  const uncovered = TYPES.filter(t => offensive[t] < 1);
  if (uncovered.length) { risk += uncovered.length * 4; issues.push({ level: 'med', text: `Tipi che resistono a tutte le tue mosse: ${uncovered.map(t => TYPE_IT[t]).join(', ')}` }); }
  const megas = members.filter(s => slotMega(s));
  if (megas.length === 0) issues.push({ level: 'low', text: 'Nessuna Mega Stone: in M-C quasi tutti i team ne portano almeno una' });
  const moveIds = members.flatMap(s => (s.moves || []).filter(Boolean).map(toID));
  if (!moveIds.some(m => SPEED_CONTROL.has(m))) { risk += 8; issues.push({ level: 'med', text: 'Nessun controllo velocità (Tailwind, Trick Room, Icy Wind, Electroweb…)' }); }
  if (!moveIds.includes('fakeout')) issues.push({ level: 'low', text: 'Nessun Fake Out nel team' });
  const noProtect = members.filter(s => !(s.moves || []).some(m => ['protect','detect','spikyshield','kingsshield','banefulbunker','silktrap','burningbulwark'].includes(toID(m))));
  if (noProtect.length > 2) issues.push({ level: 'low', text: `${noProtect.length} Pokémon senza Protect/Detect` });
  const incomplete = members.filter(s => (s.moves || []).filter(Boolean).length < 4);
  if (incomplete.length) { risk += incomplete.length * 3; issues.push({ level: 'low', text: `${incomplete.length} Pokémon con meno di 4 mosse` }); }
  const unspent = members.filter(s => spTotal(s.sp) < SP_TOTAL_MAX);
  if (unspent.length) { risk += unspent.length * 2; issues.push({ level: 'low', text: `${unspent.length} Pokémon con Stat Points non assegnati` }); }
  const legacy = team.filter(s => s && s.legacy);
  if (legacy.length) issues.push({ level: 'high', text: `${legacy.length} Pokémon non legali in Reg M-C da sostituire` });
  return { defensive, offensive, risk: Math.min(100, risk), issues, members, megas, redirect: moveIds.some(m => REDIRECTION.has(m)), intim: members.some(s => s.ability === 'Intimidate') };
}

function SpeedTiers({ team }) {
  const [mode, setMode] = useState('base');
  const rows = useMemo(() => {
    const out = [];
    team.filter(slotIsLegal).forEach(s => {
      const mega = !!slotMega(s);
      out.push({ mine: true, name: displayName(s) + (mega ? ' (Mega)' : ''), species: battleForm(s).name, spe: effectiveSpeed(s, { mega, tailwind: mode === 'tw' }) });
    });
    const seen = new Set(out.map(r => r.species));
    for (const p of PRESET_MATCHUPS.list) for (const m of p.mons) {
      const s = buildPresetSlots({ mons: [m] })[0];
      const mega = !!slotMega(s);
      const f = battleForm(s);
      if (seen.has(f.name)) continue;
      seen.add(f.name);
      out.push({ mine: false, name: f.name, species: f.name, spe: effectiveSpeed(s, { mega }) });
    }
    return out.sort((a, b) => mode === 'tr' ? a.spe - b.spe : b.spe - a.spe);
  }, [team, mode]);
  const max = Math.max(...rows.map(r => r.spe), 1);
  return (
    <div>
      <SectionTitle kicker="TUO TEAM VS META M-C">Velocità</SectionTitle>
      <div className="mb-2"><Segmented small options={[{ id: 'base', label: 'Normale' }, { id: 'tw', label: 'Tailwind mio' }, { id: 'tr', label: 'Trick Room' }]} value={mode} onChange={setMode} /></div>
      <div className="space-y-1 max-h-80 overflow-y-auto scrollbar pr-1">
        {rows.map((r, i) => (
          <div key={i} className="flex items-center gap-2" style={{ opacity: r.mine ? 1 : 0.6 }}>
            <Sprite species={r.species} small className="w-7 h-7 object-contain" />
            <span className={`font-body text-[11px] w-32 truncate ${r.mine ? 'text-stone-100 font-semibold' : 'text-stone-400'}`}>{r.name}</span>
            <div className="flex-1 h-1.5 rounded-full overflow-hidden" style={{ background: '#1b1b2c' }}>
              <div className="h-full rounded-full" style={{ width: `${r.spe / max * 100}%`, background: r.mine ? PINK : STAT_COLORS.spe + '88' }} />
            </div>
            <span className="font-mono text-[11px] w-9 text-right tabular-nums" style={{ color: r.mine ? PINK : '#8a8aa3' }}>{r.spe}</span>
          </div>
        ))}
      </div>
      <div className="font-mono text-[9px] text-stone-600 mt-1.5">Il meta usa i set dei preset (con Mega attiva). In Trick Room l'ordine è invertito.</div>
    </div>
  );
}

            <span className="font-mono text-[9px] px-2 py-0.5 rounded" style={{ background: a.redirect ? '#3fd16b18' : '#ffffff08', color: a.redirect ? '#6ff09a' : '#7a7a95' }}>Redirect {a.redirect ? '✓' : '—'}</span>
          </div>

      <div>
        <SectionTitle kicker="DIFESA · FORMA MEGA SE PRESENTE">Debolezze</SectionTitle>
        <div className="grid grid-cols-3 gap-1.5">

const STORAGE_KEY = 'porygon_teams_v2';
const STORAGE_ACTIVE = 'porygon_activeTeamId';

function App() {
  const [teams, setTeams] = useState(() => [{ id: 'team-1', name: 'Team 1', team: Array(6).fill(null), opponentTeam: Array(6).fill(null) }]);
  const [activeTeamId, setActiveTeamId] = useState('team-1');
  const [editIndex, setEditIndex] = useState(null);
  const [editOppIndex, setEditOppIndex] = useState(null);
  const [tab, setTab] = useState('team');
  const [searchOpen, setSearchOpen] = useState(false);
  const [searchSlotIndex, setSearchSlotIndex] = useState(null);
  const [searchTarget, setSearchTarget] = useState('own');
  const [ioOpen, setIoOpen] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [renamingId, setRenamingId] = useState(null);
  const [migrationNote, setMigrationNote] = useState(null);

  const activeTeam = teams.find(t => t.id === activeTeamId) || teams[0];
  const team = activeTeam?.team || Array(6).fill(null);
  const opponentTeam = activeTeam?.opponentTeam || Array(6).fill(null);
  const setTeam = v => setTeams(prev => prev.map(t => t.id === activeTeam.id ? { ...t, team: v } : t));
  const setOpponentTeam = v => setTeams(prev => prev.map(t => t.id === activeTeam.id ? { ...t, opponentTeam: v } : t));

  // ── caricamento + migrazione ──
  useEffect(() => {
    (async () => {
      try {
        const v2 = await window.storage.get(STORAGE_KEY);
        let list = null;
        if (v2?.value) list = JSON.parse(v2.value);
        else {
          const v1 = await window.storage.get('porygon_teams');
          if (v1?.value) {
            list = migrateTeams(JSON.parse(v1.value));
            const legacy = list.flatMap(t => [...t.team, ...t.opponentTeam]).filter(s => s && s.legacy).length;
            setMigrationNote(`I tuoi team sono stati convertiti a Pokémon Champions (EV → Stat Points).${legacy ? ` ${legacy} Pokémon non legali in Reg M-C sono segnalati in rosso.` : ''} Il vecchio salvataggio resta intatto come copia di sicurezza.`);
          } else {
            const old = await window.storage.get('team');
            if (old?.value) {
              const oldO = await window.storage.get('opponentTeam');
              list = migrateTeams([{ id: 'team-1', name: 'Team 1', team: JSON.parse(old.value), opponentTeam: oldO?.value ? JSON.parse(oldO.value) : Array(6).fill(null) }]);
            }
          }
        }
        if (Array.isArray(list) && list.length) {
          setTeams(list.map(t => ({ ...t, team: (t.team || []).concat(Array(6).fill(null)).slice(0, 6), opponentTeam: (t.opponentTeam || []).concat(Array(6).fill(null)).slice(0, 6) })));
          const aid = await window.storage.get(STORAGE_ACTIVE);
          if (aid?.value && list.some(t => t.id === aid.value)) setActiveTeamId(aid.value);
          else setActiveTeamId(list[0].id);
        }
      } catch (e) { console.error(e); }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    window.storage.set(STORAGE_KEY, JSON.stringify(teams));
    window.storage.set(STORAGE_ACTIVE, activeTeam.id);
  }, [teams, activeTeamId, loaded]);

  function createTeam() {
    const id = 'team-' + Date.now();
    setTeams(prev => [...prev, { id, name: `Team ${prev.length + 1}`, team: Array(6).fill(null), opponentTeam: Array(6).fill(null) }]);
    setActiveTeamId(id); setEditIndex(null); setEditOppIndex(null); setTab('team');
  }
  function deleteTeam(id) {
    if (teams.length <= 1) return;
    if (!window.confirm('Eliminare questo team?')) return;
    const next = teams.filter(t => t.id !== id);
    setTeams(next);
    if (activeTeam.id === id) { setActiveTeamId(next[0].id); setEditIndex(null); setEditOppIndex(null); }
  }
  function finishRename(id, val) { setTeams(prev => prev.map(t => t.id === id ? { ...t, name: val.trim() || t.name } : t)); setRenamingId(null); }
  function switchTeam(id) { if (id === activeTeam.id) return; setActiveTeamId(id); setEditIndex(null); setEditOppIndex(null); }

  function openSearch(idx, target = 'own') { setSearchSlotIndex(idx); setSearchTarget(target); setSearchOpen(true); }
  function addPokemon(name) {
    const isOpp = searchTarget === 'opp';
    const cur = isOpp ? opponentTeam : team;
    const idx = searchSlotIndex ?? cur.findIndex(s => !s);
    if (idx < 0) return;
    const next = [...cur]; next[idx] = newSlot(name);
    (isOpp ? setOpponentTeam : setTeam)(next);
    if (isOpp) setEditOppIndex(idx); else setEditIndex(idx);
  }
  const updateSlot = (i, p) => { const n = [...team]; n[i] = p; setTeam(n); };
  const updateOppSlot = (i, p) => { const n = [...opponentTeam]; n[i] = p; setOpponentTeam(n); };
  const removeSlot = i => { const n = [...team]; n[i] = null; setTeam(n); };
  const removeOppSlot = i => { const n = [...opponentTeam]; n[i] = null; setOpponentTeam(n); };

  const editingSlot = editIndex !== null ? team[editIndex] : null;
  const editingOppSlot = editOppIndex !== null ? opponentTeam[editOppIndex] : null;
  const teamItems = team.filter(slotIsLegal).map(s => s.item).filter(Boolean);
  const oppItems = opponentTeam.filter(slotIsLegal).map(s => s.item).filter(Boolean);

  const TABS = [
    { id: 'team', icon: <Swords size={16} />, label: 'Team' },
    { id: 'calc', icon: <Calculator size={16} />, label: 'Calc' },
    { id: 'matchup', icon: <Target size={16} />, label: 'Matchup' },
    { id: 'analysis', icon: <Shield size={16} />, label: 'Analisi' },
  ];

  if (!GEN) {
    return <div className="min-h-screen flex items-center justify-center p-6 text-center font-body text-stone-300" style={{ background: NAVY }}>
      Il motore di calcolo non si è caricato (serve la connessione internet). Ricarica la pagina.
    </div>;
  }

  return (
    <div className="min-h-screen noise-bg font-body text-stone-200">
      <div className="relative z-10 max-w-md mx-auto px-4 pb-28 pt-5">
        <header className="mb-4 flex items-center justify-between">
          <div>
            <div className="font-mono text-[9px] tracking-[0.35em] mb-1" style={{ color: `${PINK}aa` }}>{REG_LABEL}</div>
            <h1 className="font-display text-[2.7rem] text-stone-50 leading-none">Porygon<span style={{ color: CYAN }}>IA</span></h1>
          </div>
          <Emblem size={44} />
        </header>

        {migrationNote && (
          <div className="mb-3 rounded-xl px-3 py-2.5 text-[11.5px] font-body flex gap-2" style={{ background: `${CYAN}12`, border: `1px solid ${CYAN}40`, color: '#bdf0f0' }}>
            <Sparkles size={14} className="flex-shrink-0 mt-0.5" style={{ color: CYAN }} />
            <span className="flex-1">{migrationNote}</span>
            <button onClick={() => setMigrationNote(null)} className="text-stone-400"><X size={13} /></button>
          </div>
        )}

        {!editingSlot && !editingOppSlot && (
          <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-3 -mx-4 px-4 mb-1">
            {teams.map(t => (
              <div key={t.id} className="flex-shrink-0 flex items-center gap-0.5">
                {renamingId === t.id ? (
                  <input autoFocus defaultValue={t.name} onBlur={e => finishRename(t.id, e.target.value)}
                    onKeyDown={e => { if (e.key === 'Enter') finishRename(t.id, e.currentTarget.value); if (e.key === 'Escape') setRenamingId(null); }}
                    className="px-2 py-1 rounded-lg text-[11px] font-body bg-[#14141f] text-stone-100 outline-none w-24" style={{ border: `1px solid ${PINK}80` }} />
                ) : (
                  <button onClick={() => switchTeam(t.id)} onDoubleClick={() => setRenamingId(t.id)} title="Doppio tap per rinominare"
                    className="px-3 py-1.5 rounded-lg text-[11px] font-body whitespace-nowrap transition"
                    style={t.id === activeTeam.id ? { background: `${PINK}1c`, border: `1px solid ${PINK}70`, color: PINK, fontWeight: 600 } : { background: '#12121d', border: '1px solid #26263a', color: '#76768f' }}>
                    {t.name}
                  </button>
                )}
                {t.id === activeTeam.id && teams.length > 1 && renamingId !== t.id && (
                  <button onClick={() => deleteTeam(t.id)} className="p-0.5 text-[#4a4a60] hover:text-red-400"><X size={11} /></button>
                )}
              </div>
            ))}
            {teams.length < 8 && (
              <button onClick={createTeam} className="flex-shrink-0 px-3 py-1.5 rounded-lg text-[11px] font-body whitespace-nowrap" style={{ border: `1px dashed ${CYAN}55`, color: `${CYAN}aa` }}>+ nuovo</button>
            )}
          </div>
        )}

        {editingSlot && !editingSlot.legacy ? (
          <PokemonEditor slot={editingSlot} teamItems={teamItems} onChange={p => updateSlot(editIndex, p)} onClose={() => setEditIndex(null)} />
        ) : editingOppSlot && !editingOppSlot.legacy ? (
          <PokemonEditor slot={editingOppSlot} side="opp" teamItems={oppItems} onChange={p => updateOppSlot(editOppIndex, p)} onClose={() => setEditOppIndex(null)} />
        ) : (
          <>
            {tab === 'team' && (
              <div className="fade-up">
                <div className="grid grid-cols-2 gap-3">
                  {team.map((slot, i) => (
                    <TeamSlot key={i} slot={slot} index={i}
                      duplicateItem={slot && slot.item && teamItems.filter(x => x === slot.item).length > 1}
                      onClick={() => slot ? (!slot.legacy && setEditIndex(i)) : openSearch(i, 'own')}
                      onRemove={() => removeSlot(i)} />
                  ))}
                </div>
                <div className="grid grid-cols-[1fr_auto] gap-2 mt-4">
                  <button onClick={() => openSearch(null, 'own')} disabled={!team.some(s => !s)}
                    className="font-body font-semibold py-3 rounded-xl flex items-center justify-center gap-2 cta-btn disabled:opacity-30">
                    <Plus size={16} /> aggiungi Pokémon
                  </button>
                  <button onClick={() => setIoOpen(true)} className="px-4 rounded-xl hud-btn text-stone-300 flex items-center gap-1.5 text-sm"><Repeat size={14} /> import</button>
                </div>
              </div>
            )}
            {tab === 'calc' && <DamageCalculator team={team} opponentTeam={opponentTeam} />}
            {tab === 'matchup' && (
              <MatchupSimulator team={team} opponentTeam={opponentTeam}
                openOppSearch={idx => openSearch(idx, 'opp')} onEditOpp={idx => setEditOppIndex(idx)}
                onRemoveOpp={removeOppSlot} onLoadPreset={slots => setOpponentTeam([...slots, ...Array(6).fill(null)].slice(0, 6))} />
            )}
            {tab === 'analysis' && <AnalysisPanel team={team} />}
          </>
        )}
      </div>

      {/* Barra di navigazione inferiore (stile HUD) */}
      {!editingSlot && !editingOppSlot && (
        <nav className="fixed bottom-0 inset-x-0 z-40 pb-[env(safe-area-inset-bottom)]" style={{ background: 'linear-gradient(180deg, rgba(13,13,26,0) 0%, rgba(13,13,26,.92) 30%)' }}>
          <div className="max-w-md mx-auto px-4 pb-3 pt-4">
            <div className="hud-panel rounded-2xl p-1 grid grid-cols-4 gap-1">
              {TABS.map(t => (
                <button key={t.id} onClick={() => setTab(t.id)} className="py-2 rounded-xl flex flex-col items-center gap-0.5 transition"
                  style={tab === t.id ? { background: `${PINK}1f`, color: PINK } : { color: '#6a6a85' }}>
                  {t.icon}
                  <span className="text-[10px] font-body font-medium">{t.label}</span>
                </button>
              ))}
            </div>
          </div>
        </nav>
      )}

      <SearchOverlay open={searchOpen} title={searchTarget === 'opp' ? 'Aggiungi avversario' : 'Aggiungi Pokémon'} onClose={() => setSearchOpen(false)} onSelect={addPokemon} />
      <ImportExportModal open={ioOpen} onClose={() => setIoOpen(false)} team={team} onImport={slots => { if (team.some(Boolean) && !window.confirm('Sostituire il team attuale con quello importato?')) return false; setTeam([...slots, ...Array(6).fill(null)].slice(0, 6)); return true; }} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>
